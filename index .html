<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>منصة مشرف القيادة المدرسية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#006C35;--g2:#0a8a4b;--gd:#004d26;--gold:#C9A227;--gold2:#f3e6b8;--bg:#f3f5f2;--card:#fff;--ink:#1c2a22;--mut:#6b7a72;--line:#e3e8e4;
--l4:#0a7a3f;--l3:#7cb342;--l2:#e0a100;--l1:#c0392b;--na:#b8c2bc;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:15px}
.hdr{background:linear-gradient(135deg,var(--gd),var(--g) 55%,var(--g2));color:#fff;padding:16px 16px 54px;position:relative;overflow:hidden}
.hdr:after{content:"";position:absolute;left:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(201,162,39,.18)}
.hdr h1{margin:0;font-size:20px;font-weight:800}
.hdr .sub{opacity:.85;font-size:13px;margin-top:4px}
.hdr .yr{position:absolute;left:14px;top:14px;z-index:2;display:flex;gap:6px;align-items:center}
.hdr .yr select{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:4px 8px}
.hdr .yr select option{color:#000}
.nav{position:sticky;top:0;z-index:20;margin:-40px 10px 0;background:#fff;border-radius:14px;box-shadow:0 6px 20px rgba(0,60,30,.12);display:flex;overflow-x:auto;scrollbar-width:none;padding:6px}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:0 0 auto;border:0;background:none;padding:9px 13px;border-radius:10px;color:var(--mut);font-weight:700;white-space:nowrap}
.nav button.on{background:var(--g);color:#fff}
main{padding:14px 12px 90px;max-width:1100px;margin:auto}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);border:1px solid var(--line)}
.card h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.card h2:before{content:"";width:5px;height:18px;border-radius:3px;background:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}}
.kpi{background:#fff;border-radius:var(--r);padding:12px;border:1px solid var(--line);position:relative;overflow:hidden}
.kpi .v{font-size:26px;font-weight:800;color:var(--g)}
.kpi .t{font-size:12.5px;color:var(--mut)}
.kpi .s{font-size:11.5px;color:var(--mut);margin-top:2px}
.kpi:after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:var(--gold)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{border:0;background:var(--g);color:#fff;padding:10px 14px;border-radius:12px;font-weight:700;cursor:pointer}
.btn.o{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.btn.gold{background:var(--gold);color:#2a2100}
.btn.red{background:#fff;color:var(--l1);border:1.5px solid #f0c7c2}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5}
label.f{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 4px;font-weight:700}
input.i,select.i,textarea.i{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px;background:#fbfcfb;color:var(--ink)}
textarea.i{min-height:74px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{outline:none;border-color:var(--g)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.fg .full{grid-column:1/-1}
.bars .b{display:grid;grid-template-columns:minmax(90px,38%) 1fr 46px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.bars .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk{height:12px;background:#eef2ef;border-radius:8px;overflow:hidden;position:relative}
.trk i{display:block;height:100%;border-radius:8px}
.trk .mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.bars .vv{font-weight:800;text-align:left;font-size:13px}
.multi .trk{height:8px;margin:2px 0}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:800;color:#fff;white-space:nowrap}
.l4{background:var(--l4)}.l3{background:var(--l3)}.l2{background:var(--l2)}.l1{background:var(--l1)}.na{background:var(--na)}
.c4{color:var(--l4)}.c3{color:#5a8f2a}.c2{color:#b27f00}.c1{color:var(--l1)}
.list .it{border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:9px;background:#fff;cursor:pointer}
.list .it .t1{font-weight:800}
.list .it .t2{font-size:12.5px;color:var(--mut);margin-top:3px}
.muted{color:var(--mut);font-size:13px}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.tbl th{background:var(--g);color:#fff;padding:8px 6px;font-weight:700;position:sticky;top:0}
.tbl th:first-child{border-top-right-radius:10px}.tbl th:last-child{border-top-left-radius:10px}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center}
.tbl td.nm{text-align:right;font-weight:700;white-space:nowrap;position:sticky;right:0;background:#fff}
.scx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hm{border-radius:7px;padding:5px 3px;font-weight:800;color:#fff;min-width:42px;display:inline-block}
.rate{display:flex;gap:4px;margin-top:6px}
.rate button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:7px 0;font-weight:800;color:var(--mut)}
.rate button.on4{background:var(--l4);color:#fff;border-color:var(--l4)}
.rate button.on3{background:var(--l3);color:#fff;border-color:var(--l3)}
.rate button.on2{background:var(--l2);color:#fff;border-color:var(--l2)}
.rate button.on1{background:var(--l1);color:#fff;border-color:var(--l1)}
.rate button.on0{background:#888;color:#fff;border-color:#888}
.ritem{padding:10px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.dom{margin-top:12px;font-weight:800;color:var(--g);display:flex;justify-content:space-between}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips button{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-weight:700;color:var(--mut);font-size:13px}
.chips button.on{border-color:var(--g);background:#e8f3ec;color:var(--g)}
.gap{border-right:5px solid var(--l2);background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.gap.h{border-right-color:var(--l1)}.gap.m{border-right-color:var(--l2)}.gap.lw{border-right-color:#9ab}
.gap .rec{font-size:12.5px;background:#f6faf7;border-radius:9px;padding:6px 8px;margin-top:6px;color:#2d4a3a}
.modal{position:fixed;inset:0;background:rgba(10,30,20,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px 30px;animation:up .22s ease}
@media(min-width:760px){.modal{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;position:sticky;top:-16px;background:#fff;padding:6px 0;z-index:2}
.sheet .sh b{font-size:17px}
.x{border:0;background:#eef2ef;width:34px;height:34px;border-radius:50%;font-size:18px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#123;color:#fff;padding:10px 18px;border-radius:12px;z-index:99;display:none;font-weight:700}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--gd),var(--g) 60%,var(--g2))}
.login .box{background:#fff;border-radius:22px;padding:26px 20px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.login .logo{width:66px;height:66px;border-radius:18px;background:var(--gold2);color:var(--g);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:30px;font-weight:800}
.pin{letter-spacing:10px;text-align:center;font-size:24px!important;font-weight:800}
.demo{background:var(--gold2);color:#5a4500;font-size:12.5px;padding:7px 12px;text-align:center;font-weight:700}
.credit{text-align:center;color:var(--mut);font-size:11.5px;margin:20px 0 6px}
.score-ring{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-weight:800;flex:0 0 auto}
.score-ring b{font-size:24px}.score-ring span{font-size:11px;opacity:.9}
.note-st{font-size:11.5px;padding:2px 8px;border-radius:12px;font-weight:800}
.st-open{background:#fde8e6;color:var(--l1)}.st-prog{background:#fff3d6;color:#9a6c00}.st-done{background:#e3f3e9;color:var(--l4)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:6px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-left:4px}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:98;display:none;align-items:center;justify-content:center}
.loading.on{display:flex}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid #d6e6dc;border-top-color:var(--g);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;font-size:12.5px;color:#000}
  @page{size:A4;margin:12mm}
}
.pr-h{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px double var(--g);padding-bottom:8px;margin-bottom:10px;font-size:12px;line-height:1.6}
.pr-t{text-align:center;font-size:18px;font-weight:800;color:var(--g);margin:6px 0 10px}
.pr table{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:12px}
.pr td,.pr th{border:1px solid #9aa;padding:5px 6px}
.pr th{background:#e8f1ec}
.pr .sec{font-weight:800;color:var(--g);margin:12px 0 4px;border-bottom:1px solid #cdd;padding-bottom:3px}
.pr .box{border:1px solid #9aa;min-height:40px;padding:6px;border-radius:4px;white-space:pre-wrap}
.pr .sig{display:flex;justify-content:space-around;margin-top:28px;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="loading" id="loading"><div class="spin"></div></div>
<div id="print"></div>
<script>
/* ===== الإعدادات الافتراضية (تُحقن عند البناء) ===== */
const DEFAULTS = {"settings": {"appTitle": "منصة مشرف القيادة المدرسية", "supName": "اسم المشرف", "supTitle": "مشرف القيادة المدرسية", "region": "الإدارة العامة للتعليم بمنطقة المدينة المنورة", "office": "مكتب التعليم", "year": "1448", "wVisit": "30", "wNafs": "40", "wInd": "30", "gapThr": "10", "target": "80", "pin": "1234", "visitTarget": "2"}, "items": [["القيادة والإدارة المدرسية", "وضوح الرؤية والرسالة وتفعيل الخطة التشغيلية ومتابعة مؤشراتها"], ["القيادة والإدارة المدرسية", "تشكيل اللجان والمجالس المدرسية وتفعيلها بمحاضر موثقة"], ["القيادة والإدارة المدرسية", "متابعة الانضباط المدرسي (حضور الطلاب والمعلمين والتأخر)"], ["القيادة والإدارة المدرسية", "تفعيل نظام نور والأنظمة الإلكترونية وجودة التوثيق والسجلات"], ["القيادة والإدارة المدرسية", "إدارة الموارد والميزانية التشغيلية والعهد المدرسية"], ["التعليم والتعلم", "تنفيذ الزيارات الصفية وتقييم أداء المعلمين وفق الدليل الإجرائي"], ["التعليم والتعلم", "تفعيل مجتمعات التعلم المهنية والتطوير المهني للمعلمين"], ["التعليم والتعلم", "تفعيل منصة مدرستي وتوظيف التقنية في التعليم"], ["التعليم والتعلم", "تنفيذ الخطط العلاجية والإثرائية ومتابعة أثرها"], ["نواتج التعلم", "تحليل نتائج نافس والاختبارات التشخيصية وبناء خطط التحسين"], ["نواتج التعلم", "متابعة مستويات الطلاب ونسب التمكن في المواد الأساسية"], ["نواتج التعلم", "رعاية الموهوبين وذوي الإعاقة والطلاب المتعثرين"], ["البيئة المدرسية والشراكة", "تطبيق اشتراطات الأمن والسلامة وخطط الإخلاء"], ["البيئة المدرسية والشراكة", "سلامة البيئة الصفية والمرافق والنظافة والمقصف"], ["البيئة المدرسية والشراكة", "التواصل مع الأسرة والشراكة المجتمعية"], ["البيئة المدرسية والشراكة", "تفعيل التوجيه الطلابي والنشاط وبرامج السلوك والمواظبة"]], "indDefs": [["نسبة حضور الطلاب", "95", "أعلى", "%", "1"], ["نسبة انضباط المعلمين", "97", "أعلى", "%", "1"], ["نسبة الغياب بدون عذر", "3", "أقل", "%", "1"], ["نسبة إنجاز الخطة التشغيلية", "90", "أعلى", "%", "1"], ["نسبة تفعيل منصة مدرستي", "90", "أعلى", "%", "1"], ["نسبة تنفيذ الخطط العلاجية", "90", "أعلى", "%", "1"], ["نسبة رضا المستفيدين", "85", "أعلى", "%", "1"]]};
const FB_CONFIG = /*__FBCONFIG__*/null;
const FB = !!FB_CONFIG;
const FB_RULES = "rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n\n    function signed()  { return request.auth != null; }\n    function uref()    { return /databases/$(database)/documents/users/$(request.auth.uid); }\n    function active()  { return signed() && exists(uref()) && get(uref()).data.active != 'لا'; }\n    function isAdmin() { return active() && get(uref()).data.role == 'admin'; }\n    function mine(sid) { return active() && sid in get(uref()).data.schoolIds; }\n    function ownerRef(){ return /databases/$(database)/documents/config/owner; }\n\n    // أول حساب مشرف قيادة (مرة واحدة فقط)\n    match /config/owner {\n      allow read: if true;\n      allow create: if signed() && !exists(ownerRef()) && request.resource.data.uid == request.auth.uid;\n    }\n    match /config/main {\n      allow read: if active();\n      allow write: if isAdmin();\n    }\n\n    match /users/{uid} {\n      allow read: if isAdmin() || (signed() && request.auth.uid == uid);\n      allow create: if isAdmin() || (signed() && request.auth.uid == uid && !exists(ownerRef())\n                    && getAfter(ownerRef()).data.uid == uid && request.resource.data.role == 'admin');\n      allow update, delete: if isAdmin();\n    }\n\n    match /schools/{id} {\n      allow read: if isAdmin() || mine(id);\n      allow write: if isAdmin();\n    }\n\n    // الزيارات: المشرف الزائر يدير زياراته فقط في مدارسه\n    match /visits/{id} {\n      allow read: if isAdmin() || mine(resource.data.schoolId);\n      allow create: if isAdmin() || (mine(request.resource.data.schoolId) && request.resource.data.visitorId == request.auth.uid);\n      allow update: if isAdmin() || (mine(resource.data.schoolId) && resource.data.visitorId == request.auth.uid\n                    && mine(request.resource.data.schoolId) && request.resource.data.visitorId == request.auth.uid);\n      allow delete: if isAdmin() || (mine(resource.data.schoolId) && resource.data.visitorId == request.auth.uid);\n    }\n\n    // الملاحظات ونتائج نافس وقيم المؤشرات: لمدارس المستخدم فقط\n    match /{col}/{id} {\n      function ok() { return col in ['notes', 'nafs', 'indVals']; }\n      allow read: if ok() && (isAdmin() || mine(resource.data.schoolId));\n      allow create: if ok() && (isAdmin() || mine(request.resource.data.schoolId));\n      allow update: if ok() && (isAdmin() || (mine(resource.data.schoolId) && mine(request.resource.data.schoolId)));\n      allow delete: if ok() && (isAdmin() || mine(resource.data.schoolId));\n    }\n  }\n}\n";
const DEMO = !FB && (typeof google === 'undefined' || !google.script);
const MINPW = FB ? 6 : 4;
const APP_URL = /*__URL__*/'';
const GRADES = {'الثالث الابتدائي':['القراءة','الرياضيات'],'السادس الابتدائي':['القراءة','الرياضيات','العلوم'],'الثالث المتوسط':['القراءة','الرياضيات','العلوم']};
const VTYPES = ['زيارة إشرافية شاملة','زيارة متابعة','زيارة دعم وتمكين','زيارة مفاجئة','زيارة افتراضية'];
const RATES = [[4,'عالٍ'],[3,'متحقق'],[2,'جزئي'],[1,'غير متحقق'],[0,'لا ينطبق']];
let PIN = '', DB = null, S = {tab:'home', year:'', vf:'', nf:{st:'open', sc:''}, nafsSc:'', indSc:'', gapSc:'', cmpA:'', cmpB:'', rep:'', vv:''};
let LOCAL = null; // قاعدة بيانات وضع المعاينة
let ME = {id:'',name:'',role:'admin'};
const isAdmin = () => ME.role==='admin';
const ROLES = {admin:'مشرف القيادة (الإدارة)', visitor:'مشرف زائر'};
const canEdit = v => isAdmin() || (v && v.visitorId===ME.id);

/* ===== أدوات ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if(v===''||v==null) return null; const n = parseFloat(String(v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(',','.')); return isNaN(n)?null:n; };
const avg = a => { const b = a.filter(x => x!=null && !isNaN(x)); return b.length ? b.reduce((s,x)=>s+x,0)/b.length : null; };
const f0 = v => v==null ? '—' : (Math.round(v*10)/10).toString();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const today = () => new Date().toISOString().slice(0,10);
function toast(t){ const e=$('#toast'); e.textContent=t; e.style.display='block'; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display='none',2400); }
function busy(on){ $('#loading').classList.toggle('on', !!on); }
function lvl(v){ if(v==null||isNaN(v)) return {t:'لا توجد بيانات',c:'na',col:'var(--na)'}; if(v>=85) return {t:'متميز',c:'l4',col:'var(--l4)'}; if(v>=75) return {t:'متقدم',c:'l3',col:'var(--l3)'}; if(v>=60) return {t:'متوسط',c:'l2',col:'var(--l2)'}; return {t:'يحتاج دعم',c:'l1',col:'var(--l1)'}; }
const badge = v => { const l=lvl(v); return `<span class="badge ${l.c}">${l.t}</span>`; };
const hm = v => `<span class="hm" style="background:${lvl(v).col}">${f0(v)}</span>`;
function set(k){ return DB.settings[k]!=null && DB.settings[k]!=='' ? DB.settings[k] : (DEFAULTS.settings[k]||''); }

/* ===== الاتصال بالخادم ===== */
function call(action, payload){
  return new Promise((res, rej) => {
    if (FB){ window.FBA.call(action, payload).then(res).catch(e=>rej(fbErr(e))); return; }
    if (DEMO){ try{ res(demoApi(action, payload)); }catch(e){ rej(e.message||e); } return; }
    google.script.run.withSuccessHandler(r => r && r.error ? rej(r.error) : res(r))
      .withFailureHandler(e => rej(e && e.message || e)).api(PIN, action, payload || null);
  });
}
async function run(ops, msg){
  busy(true);
  try{ const r = await call('batch', ops); load(r.db); render(); if(msg) toast(msg); return true; }
  catch(e){ toast('خطأ: ' + e); return false; }
  finally{ busy(false); }
}
function load(db){
  DB = db; ME = DB.me || ME; DB.users = DB.users || [];
  DB.visits.forEach(v => { try{ v.ratings = typeof v.ratings==='string' ? JSON.parse(v.ratings||'[]') : (v.ratings||[]); }catch(e){ v.ratings=[]; } v.score = num(v.score); });
  DB.nafs.forEach(n => { n.score = num(n.score); n.national = num(n.national); });
  DB.indVals.forEach(n => n.value = num(n.value));
  DB.indDefs.forEach(d => { d.target = num(d.target); d.weight = num(d.weight)||1; });
  DB.schools.sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar'));
  if(!S.year) S.year = String(set('year'));
}

function demoApi(action, p){
  if(!LOCAL){ LOCAL = {settings:Object.assign({},DEFAULTS.settings), schools:[], visits:[], notes:[], nafs:[], indVals:[],
    indDefs:DEFAULTS.indDefs.map(r=>({name:r[0],target:r[1],dir:r[2],unit:r[3],weight:r[4]})), items:DEFAULTS.items.map(r=>({domain:r[0],item:r[1]})), users:[]};
    applyOps(LOCAL, demoData()); }
  const pin = String(action==='login' ? p.pin : PIN);
  let u = demoUser(pin);
  if(action==='batch'){ applyOps(LOCAL, p, u); const np=(p.find(o=>o.op==='myPin')||{}).pin || (p.find(o=>o.op==='settings'&&o.obj.pin&&u.master)||{obj:{}}).obj.pin; if(np) u=demoUser(np); }
  return {db:viewFor(LOCAL,u)};
}
function demoUser(pin){
  if(pin===String(LOCAL.settings.pin)) return {id:'admin',name:LOCAL.settings.supName,role:'admin',schools:'*',master:true};
  const u=LOCAL.users.find(x=>String(x.pin)===pin && x.active!=='لا'); if(!u) throw new Error('رمز الدخول غير صحيح'); return u;
}
function viewFor(D,u){
  const c = JSON.parse(JSON.stringify(D)); delete c.settings.pin;
  const A = (u.role==='admin'||u.schools==='*') ? null : String(u.schools||'').split(',').map(x=>x.trim());
  if(A){ c.schools=c.schools.filter(x=>A.includes(x.id)); ['visits','notes','nafs','indVals'].forEach(k=>c[k]=c[k].filter(x=>A.includes(x.schoolId))); }
  if(u.role!=='admin') c.users=[];
  c.me={id:u.id,name:u.name,role:u.role,master:!!u.master}; return c;
}
function applyOps(D, ops, u){
  ops.forEach(o => {
    const t = D[o.t];
    if(o.op==='myPin'){ D.users.forEach(x=>{ if(u&&x.id===u.id) x.pin=o.pin; }); return; }
    if(o.t==='visits'&&o.op==='upsert'&&u&&u.role!=='admin'){ o.obj.visitorId=u.id; o.obj.visitorName=u.name; }
    if(o.op==='upsert'){ const i=t.findIndex(x=>x.id===o.obj.id); const ob=Object.assign({},o.obj); if(ob.ratings && typeof ob.ratings!=='string') ob.ratings=JSON.stringify(ob.ratings); i>=0? t[i]=ob : t.push(ob); }
    else if(o.op==='remove'){ D[o.t] = t.filter(x=>x.id!==o.id); }
    else if(o.op==='removeWhere'){ D[o.t] = t.filter(x=>!Object.keys(o.match).every(k=>String(x[k])===String(o.match[k]))); }
    else if(o.op==='replace'){ D[o.t] = t.filter(x=>!Object.keys(o.match).every(k=>String(x[k])===String(o.match[k]))).concat(o.rows); }
    else if(o.op==='setList'){ D[o.t] = o.rows; }
    else if(o.op==='settings'){ Object.keys(o.obj).forEach(k=>{ if(k!=='pin'||o.obj[k]) D.settings[k]=o.obj[k]; }); }
    else if(o.op==='clearDemo'){ ['schools','visits','notes','nafs','indVals','users'].forEach(k=> D[k]=D[k].filter(x=>!String(x.id).startsWith('demo') && !String(x.schoolId||'').startsWith('demo'))); }
  });
}
function demoData(){
  let seed = 7; const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
  const names = ['مدرسة تجريبية (أ) الابتدائية','مدرسة تجريبية (ب) الابتدائية','مدرسة تجريبية (ج) الابتدائية','مدرسة تجريبية (د) الابتدائية','مدرسة تجريبية (هـ) الابتدائية','مدرسة تجريبية (و) الابتدائية'];
  const q = [0.92,0.8,0.68,0.85,0.55,0.74]; const ops=[]; const y = String(DEFAULTS.settings.year);

  const vis=[{id:'demoU1',name:'المشرف الزائر (1)',role:'visitor',pin:'1111',schools:'demo0,demo1,demo2',phone:'',active:'نعم'},{id:'demoU2',name:'المشرف الزائر (2)',role:'visitor',pin:'2222',schools:'demo3,demo4,demo5',phone:'',active:'نعم'}];
  vis.forEach(u=>ops.push({op:'upsert',t:'users',obj:u}));
  names.forEach((nm,k)=>{

    for(let v=0; v<(k===5?1:2); v++){
      const ratings = items.map(r=>({d:r[0],i:r[1],s:Math.max(1,Math.min(4,Math.round(q[k]*4 + (rnd()-0.5)*1.6)))}));
      const vid='demoV'+k+v; const sc = ratings.reduce((s,r)=>s+r.s,0)/(ratings.length*4)*100;
      ops.push({op:'upsert',t:'visits',obj:{id:vid,year:y,date:`2026-${v?'11':'09'}-${String(5+k*3).padStart(2,'0')}`,schoolId:id,schoolName:nm,type:VTYPES[v],purpose:v?'متابعة توصيات الزيارة السابقة':'زيارة إشرافية شاملة لمجالات العمل المدرسي',ratings:JSON.stringify(ratings),score:sc.toFixed(1),strengths:'تفعيل اللجان المدرسية، وانتظام اليوم الدراسي.',notes:'الحاجة إلى تعزيز تحليل النتائج وربطه بالخطط العلاجية.',recs:'بناء خطة تحسين لنتائج نافس، وتفعيل مجتمعات التعلم في الرياضيات.',followDate:`2026-12-${String(1+k*4).padStart(2,'0')}`,status:'مكتملة',visitorId:vis[k<3?0:1].id,visitorName:vis[k<3?0:1].name}});
      if(q[k]<0.8) ops.push({op:'upsert',t:'notes',obj:{id:'demoN'+k+v,visitId:vid,schoolId:id,schoolName:nm,domain:v?'نواتج التعلم':'التعليم والتعلم',text:v?'ضعف نسب التمكن في الرياضيات للصف السادس':'عدم انتظام الزيارات الصفية لبعض المعلمين',priority:v?'عالية':'متوسطة',owner:'مدير المدرسة',due:`2026-${v?'12-15':'11-10'}`,status:v?'مفتوحة':'قيد التنفيذ',closedDate:''}});
    }
    ['1447',y].forEach((yy,yi)=>{ Object.keys(GRADES).slice(0,2).forEach(g=>GRADES[g].forEach(sb=>{
      const nat = {القراءة:68,الرياضيات:61,العلوم:63}[sb];
      ops.push({op:'upsert',t:'nafs',obj:{id:'demoF'+k+yi+g.length+sb.length,schoolId:id,schoolName:nm,year:yy,grade:g,subject:sb,score:(nat*q[k]*1.25 + (rnd()-0.5)*10 + yi*3).toFixed(1),national:String(nat)}});
    })); });
    defs.forEach((d,j)=>{ const t=num(d[1]); const val = d[2]==='أقل' ? t/(q[k]+0.05) : t*(0.75+q[k]*0.27) ; ops.push({op:'upsert',t:'indVals',obj:{id:'demoI'+k+j,schoolId:id,schoolName:nm,year:y,name:d[0],value:Math.min(100,val).toFixed(1)}}); });

/* ===== محرك الحساب ===== */
const domains = () => [...new Set(DB.items.map(x=>x.domain))];
const sName = id => (DB.schools.find(s=>s.id===id)||{}).name || '—';
const yVisits = sid => DB.visits.filter(v=>String(v.year)===S.year && (!sid || v.schoolId===sid));
function vPct(r){ const a=(r||[]).filter(x=>x.s>0); return a.length ? a.reduce((s,x)=>s+x.s,0)/(a.length*4)*100 : null; }
const visitScore = sid => avg(yVisits(sid).map(v=>v.score));
function domainScore(sid, d){ return avg(yVisits(sid).map(v=>vPct(v.ratings.filter(r=>r.d===d)))); }
function nafsYear(sid){ const ys = DB.nafs.filter(n=>n.schoolId===sid && Number(n.year)<=Number(S.year)).map(n=>Number(n.year)); return ys.length ? String(Math.max(...ys)) : null; }
function nafsRow(sid,g,sb,yr){ yr = yr || nafsYear(sid); return DB.nafs.find(n=>n.schoolId===sid && String(n.year)===yr && n.grade===g && n.subject===sb); }
function nafsScore(sid){ const y=nafsYear(sid); return y ? avg(DB.nafs.filter(n=>n.schoolId===sid && String(n.year)===y).map(n=>n.score)) : null; }
function indVal(sid,name){ const r=DB.indVals.find(x=>x.schoolId===sid && String(x.year)===S.year && x.name===name); return r ? r.value : null; }
function ach(d, v){ if(v==null || !d.target) return null; if(d.dir==='أقل') return v<=0 ? 100 : Math.min(100, d.target/v*100); return Math.min(100, v/d.target*100); }
function indScore(sid){ let s=0,w=0; DB.indDefs.forEach(d=>{ const a=ach(d, indVal(sid,d.name)); if(a!=null){ s+=a*d.weight; w+=d.weight; } }); return w ? s/w : null; }
function composite(sid){
  const parts=[[visitScore(sid),num(set('wVisit'))||0],[nafsScore(sid),num(set('wNafs'))||0],[indScore(sid),num(set('wInd'))||0]];
  let s=0,w=0; parts.forEach(([v,ww])=>{ if(v!=null && ww>0){ s+=v*ww; w+=ww; } }); return w ? s/w : null;
}
function nafsCombos(){ const m=new Map(); DB.nafs.forEach(n=>{ const k=n.grade+'|'+n.subject; if(!m.has(k)) m.set(k,{g:n.grade,s:n.subject}); }); const order=Object.keys(GRADES); return [...m.values()].sort((a,b)=>order.indexOf(a.g)-order.indexOf(b.g)); }
const shortG = g => g.replace('الابتدائي','ابتدائي').replace('الثالث','ثالث').replace('السادس','سادس').replace('المتوسط','متوسط');
function dims(){
  const d=[];
  domains().forEach(x=>d.push({cat:'الزيارات',label:x,val:sid=>domainScore(sid,x),ref:()=>num(set('target'))}));
  nafsCombos().forEach(c=>d.push({cat:'نافس',label:`${c.s} – ${shortG(c.g)}`,g:c.g,s:c.s,val:sid=>{const r=nafsRow(sid,c.g,c.s);return r?r.score:null;},ref:sid=>{const r=nafsRow(sid,c.g,c.s);return r&&r.national!=null?r.national:num(set('target'));}}));
  DB.indDefs.forEach(x=>d.push({cat:'المؤشرات',label:x.name,def:x,val:sid=>ach(x,indVal(sid,x.name)),raw:sid=>indVal(sid,x.name),ref:()=>100}));
  return d;
}
const meanOf = fn => avg(DB.schools.map(s=>fn(s.id)));
function gapsFor(sid){
  const thr = num(set('gapThr'))||10, out=[];
  dims().forEach(dm=>{
    const v=dm.val(sid); if(v==null) return;
    const m=meanOf(dm.val), ref=dm.ref(sid), gm = m==null?0:v-m, gr = ref==null?0:v-ref;
    let sev=null;
    if(v<60 || gm<=-2*thr) sev='h'; else if(gm<=-thr || gr<=-10) sev='m'; else if(gr<0) sev='lw';
    if(sev) out.push({dm,v,m,ref,gm,gr,sev});
  });
  const o={h:0,m:1,lw:2}; return out.sort((a,b)=>o[a.sev]-o[b.sev] || a.v-b.v);
}
function recFor(g){
  const d=g.dm;
  if(d.cat==='نافس') return `بناء خطة علاجية مركزة في ${d.s} لطلاب ${d.g}، وتطبيق اختبارات محاكية دورية، وتفعيل مجتمع تعلم مهني لمعلمي المادة، والاستفادة من ممارسات المدرسة الأعلى أداءً.`;
  if(d.cat==='الزيارات') return `جدولة زيارة دعم وتمكين في مجال «${d.label}» خلال أسبوعين، ومراجعة الشواهد مع قائد المدرسة، وتحديد إجراءات تحسين بمسؤوليات وتواريخ.`;
  return `متابعة مؤشر «${d.label}» أسبوعياً، وتحليل أسبابه مع فريق المدرسة، ووضع مستهدف مرحلي قابل للقياس حتى بلوغ المستهدف (${f0(d.def.target)}${esc(d.def.unit||'')}).`;
}
function spreads(){
  return dims().map(dm=>{ const vals=DB.schools.map(s=>({s,v:dm.val(s.id)})).filter(x=>x.v!=null); if(vals.length<2) return null;
    vals.sort((a,b)=>b.v-a.v); return {dm,best:vals[0],worst:vals[vals.length-1],spread:vals[0].v-vals[vals.length-1].v}; })
    .filter(Boolean).sort((a,b)=>b.spread-a.spread);
}

/* ===== متابعة المشرفين الزائرين (مشرف القيادة) ===== */
function visStats(u){
  const tgt=num(set('visitTarget'))||2;
  const ids = u.schools==='*' ? DB.schools.map(s=>s.id) : String(u.schools||'').split(',').map(x=>x.trim()).filter(x=>DB.schools.some(s=>s.id===x));
  const vs = yVisits().filter(v=>v.visitorId===u.id);
  const done = ids.reduce((s,id)=>s+Math.min(tgt, vs.filter(v=>v.schoolId===id).length),0);
  const nv = ids.filter(id=>!vs.some(v=>v.schoolId===id));
  const ns = DB.notes.filter(n=>vs.some(v=>v.id===n.visitId));
  return {ids, vs, nv, compl: ids.length? done/(ids.length*tgt)*100 : null, avgS: avg(vs.map(v=>v.score)),
    closeR: ns.length? ns.filter(n=>n.status==='مغلقة').length/ns.length*100 : null, nsOpen: ns.filter(n=>n.status!=='مغلقة').length,
    last: vs.map(v=>v.date).sort().pop()||'—'};
}

function waLink(v){

  if(id===ME.id){ o.role='admin'; o.active='نعم'; o.schools='*'; }
  if(FB){ if(exists){ const old=DB.users.find(x=>x.id===id); o.phone=old.phone; delete o.pin; }
    else { if(!/^05\d{8}$/.test(o.phone.replace(/\D/g,'').replace(/^9665/,'05'))) return toast('اكتب رقم جوال صحيح 05xxxxxxxx'); if(o.pin.length<6) return toast('كلمة المرور 6 خانات على الأقل'); }
    const pw=o.pin; return run([{op:'upsert',t:'users',obj:o}],'تم حفظ المستخدم').then(ok=>{ if(ok){ if(!exists){ const nu=DB.users.find(x=>x.phone===o.phone)||o; userForm(nu.id); setTimeout(()=>{ const a=document.querySelector('a[href^="https://wa.me"]'); if(a) a.href=userWa(Object.assign({},nu,{pin:pw})); },50); toast('تم إنشاء الحساب — أرسل له بيانات الدخول'); } else closeModal(); } }); }
  if(o.pin.length<4) return toast('الرمز 4 خانات على الأقل');
  if(DB.users.some(x=>x.id!==id&&String(x.pin)===o.pin)) return toast('الرمز مستخدم لمستخدم آخر');
  run([{op:'upsert',t:'users',obj:o}],'تم حفظ المستخدم').then(ok=>ok&&closeModal()); }
function delUser(id){ if(id===ME.id) return toast('لا يمكنك حذف حسابك'); if(confirm('حذف المستخدم؟ (تبقى زياراته محفوظة)')) run([{op:'remove',t:'users',id}],'تم الحذف').then(closeModal); }
function saveItems(){ const rows=$('#itemsTx').value.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a.length>=2&&a[0]&&a[1]).map(a=>({domain:a[0],item:a.slice(1).join(' - ')})); if(!rows.length) return toast('لا توجد بنود'); run([{op:'setList',t:'items',rows}],'تم حفظ البنود'); }
function saveDefs(){ const rows=$('#defsTx').value.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a[0]).map(a=>({name:a[0],target:a[1]||'100',dir:(a[2]||'').includes('أقل')?'أقل':'أعلى',unit:a[3]||'%',weight:a[4]||'1'})); run([{op:'setList',t:'indDefs',rows}],'تم حفظ المؤشرات'); }
function schoolForm(id){
  const s = id ? DB.schools.find(x=>x.id===id) : {id:uid(),name:'',ministryNo:'',stage:'ابتدائي',principal:'',phone:'',students:'',district:''};
  const F=[['name','اسم المدرسة','full'],['ministryNo','الرقم الوزاري',''],['stage','المرحلة',''],['principal','قائد المدرسة',''],['phone','الجوال',''],['students','عدد الطلاب',''],['district','الحي / القطاع','']];
  openModal(head(id?'تعديل مدرسة':'إضافة مدرسة')+`<div class="fg">${F.map(([k,t,c])=>`<div class="${c}"><label class="f">${t}</label><input class="i" id="sc_${k}" value="${esc(s[k])}"></div>`).join('')}</div>
  <div class="row" style="margin-top:12px"><button class="btn" onclick="saveSchool('${s.id}')">حفظ</button>${id?`<span class="sp"></span><button class="btn red" onclick="delSchool('${s.id}')">حذف المدرسة وبياناتها</button>`:''}</div>`);
}
function saveSchool(id){ const o={id}; ['name','ministryNo','stage','principal','phone','students','district'].forEach(k=>o[k]=$('#sc_'+k).value.trim()); if(!o.name) return toast('اكتب اسم المدرسة'); run([{op:'upsert',t:'schools',obj:o}],'تم الحفظ').then(ok=>ok&&closeModal()); }
function delSchool(id){ if(!confirm('سيتم حذف المدرسة وجميع زياراتها وملاحظاتها ونتائجها. متابعة؟')) return;
  run([{op:'remove',t:'schools',id},...['visits','notes','nafs','indVals'].map(t=>({op:'removeWhere',t,match:{schoolId:id}}))],'تم الحذف').then(closeModal); }

if(!FB) loginView(); else $('#app').innerHTML='<div class="login"><div class="spin"></div></div>';
</script>
<script type="module">
/* ===== طبقة الربط مع Firebase (Auth + Firestore) ===== */
if (FB_CONFIG) {
  const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
  const { initializeApp, deleteApp } = await import(base + 'firebase-app.js');
  const A = await import(base + 'firebase-auth.js');
  const F = await import(base + 'firebase-firestore.js');
  const app = initializeApp(FB_CONFIG);
  const auth = A.getAuth(app);
  const db = F.getFirestore(app);
  const COLS = ['schools', 'visits', 'notes', 'nafs', 'indVals'];
  let RAW = null, U = null;

  const normPhone = p => { let d = String(p || '').replace(/[٠-٩]/g, x => '٠١٢٣٤٥٦٧٨٩'.indexOf(x)).replace(/\D/g, ''); if (d.startsWith('966')) d = '0' + d.slice(3); if (d.length === 9 && d.startsWith('5')) d = '0' + d; return d; };
  const email = p => normPhone(p) + '@sup-platform.app';
  const clean = o => JSON.parse(JSON.stringify(o));
  const ref = (c, id) => F.doc(db, c, String(id));

  async function profile(uid) { const s = await F.getDoc(ref('users', uid)); return s.exists() ? { ...s.data(), id: uid } : null; }

  function defaultsCfg() {
    const st = { ...DEFAULTS.settings }; delete st.pin;
    return { settings: st, items: DEFAULTS.items.map(r => ({ domain: r[0], item: r[1] })), indDefs: DEFAULTS.indDefs.map(r => ({ name: r[0], target: r[1], dir: r[2], unit: r[3], weight: r[4] })) };
  }
  const all = async c => (await F.getDocs(F.collection(db, c))).docs.map(d => ({ ...d.data(), id: d.id }));

  async function loadAll() {
    const cs = await F.getDoc(ref('config', 'main'));
    let cfg = cs.exists() ? cs.data() : null;
    if (!cfg) { cfg = defaultsCfg(); if (U.role === 'admin') await F.setDoc(ref('config', 'main'), cfg); }
    const D = { settings: cfg.settings || {}, items: cfg.items || [], indDefs: cfg.indDefs || [], users: [] };
    if (U.role === 'admin') {
      const r = await Promise.all(COLS.map(all)); COLS.forEach((c, i) => D[c] = r[i]);
      D.users = await all('users');
    } else {
      const ids = (U.schoolIds || []).filter(Boolean);
      D.schools = (await Promise.all(ids.map(id => F.getDoc(ref('schools', id))))).filter(s => s.exists()).map(s => ({ ...s.data(), id: s.id }));
      for (const c of COLS.slice(1)) {
        const parts = await Promise.all(ids.map(id => F.getDocs(F.query(F.collection(db, c), F.where('schoolId', '==', id)))));
        D[c] = parts.flatMap(q => q.docs.map(d => ({ ...d.data(), id: d.id })));
      }
    }
    RAW = D; return view();
  }
  function view() { const c = clean(RAW); c.me = { id: U.id, name: U.name, role: U.role }; return c; }

  async function afterAuth() {
    const pr = await profile(auth.currentUser.uid);
    if (!pr || pr.active === 'لا') { await A.signOut(auth); throw new Error('الحساب غير مفعّل أو محذوف — تواصل مع مشرف القيادة'); }
    U = pr; return { db: await loadAll() };
  }

  async function createAccount(phone, pw) {
    const sec = initializeApp(FB_CONFIG, 'sec' + Date.now());
    try { const sa = A.getAuth(sec); const cr = await A.createUserWithEmailAndPassword(sa, email(phone), pw); await A.signOut(sa); return cr.user.uid; }
    finally { await deleteApp(sec); }
  }

  async function applyRemote(ops) {
    let b = F.writeBatch(db), n = 0;
    const step = async () => { if (++n >= 450) { await b.commit(); b = F.writeBatch(db); n = 0; } };
    const matchRows = (t, m) => (RAW[t] || []).filter(x => Object.keys(m).every(k => String(x[k]) === String(m[k])));
    for (const o of ops) {
      if (o.op === 'myPin') { await A.updatePassword(auth.currentUser, o.pin); continue; }
      if (o.op === 'settings') {
        const { pin, ...rest } = o.obj;
        if (pin) await A.updatePassword(auth.currentUser, pin);
        delete o.obj.pin;
        b.set(ref('config', 'main'), { settings: clean({ ...RAW.settings, ...rest }) }, { merge: true }); await step(); continue;
      }
      if (o.op === 'setList') { b.set(ref('config', 'main'), { [o.t]: clean(o.rows) }, { merge: true }); await step(); continue; }
      if (o.op === 'clearDemo') {
        for (const c of COLS.concat('users')) for (const x of (RAW[c] || [])) if (String(x.id).startsWith('demo') || String(x.schoolId || '').startsWith('demo')) { b.delete(ref(c, x.id)); await step(); }
        continue;
      }
      if (o.op === 'upsert' && o.t === 'users') {
        const ex = RAW.users.find(x => x.id === o.obj.id);
        if (!ex) { o.obj.id = await createAccount(o.obj.phone, o.obj.pin); o.obj.phone = normPhone(o.obj.phone); }
        delete o.obj.pin;
        const data = { name: o.obj.name, role: o.obj.role, phone: o.obj.phone || (ex && ex.phone) || '', active: o.obj.active || 'نعم',
          schools: o.obj.role === 'admin' ? '*' : String(o.obj.schools || ''), schoolIds: o.obj.role === 'admin' ? [] : String(o.obj.schools || '').split(',').map(x => x.trim()).filter(Boolean) };
        Object.assign(o.obj, data);
        b.set(ref('users', o.obj.id), data); await step(); continue;
      }
      if (o.op === 'upsert') { const d = clean(o.obj); delete d.id; b.set(ref(o.t, o.obj.id), d); await step(); }
      else if (o.op === 'remove') { b.delete(ref(o.t, o.id)); await step(); }
      else if (o.op === 'removeWhere') { for (const x of matchRows(o.t, o.match)) { b.delete(ref(o.t, x.id)); await step(); } }
      else if (o.op === 'replace') {
        for (const x of matchRows(o.t, o.match)) { b.delete(ref(o.t, x.id)); await step(); }
        for (const r of (o.rows || [])) { const d = clean(r); delete d.id; b.set(ref(o.t, r.id), d); await step(); }
      }
    }
    if (n) await b.commit();
  }

  async function call(action, p) {
    if (action === 'login') { await A.signInWithEmailAndPassword(auth, email(p.phone), p.pw); return afterAuth(); }
    if (action === 'setupOwner') {
      const cr = await A.createUserWithEmailAndPassword(auth, email(p.phone), p.pw);
      const b = F.writeBatch(db);
      b.set(ref('users', cr.user.uid), { name: p.name, role: 'admin', phone: normPhone(p.phone), active: 'نعم', schools: '*', schoolIds: [] });
      b.set(ref('config', 'owner'), { uid: cr.user.uid });
      await b.commit();
      return afterAuth();
    }
    if (action === 'load') return { db: await loadAll() };
    if (action === 'batch') {
      const ops = clean(p);
      if (U.role !== 'admin') ops.forEach(o => { if (o.t === 'visits' && o.op === 'upsert') { o.obj.visitorId = U.id; o.obj.visitorName = U.name; } });
      await applyRemote(ops);
      applyOps(RAW, ops, U);
      return { db: view() };
    }
    throw new Error('إجراء غير معروف');
  }

  window.FBA = {
    call,
    signOut: () => A.signOut(auth),
    ownerExists: async () => (await F.getDoc(ref('config', 'owner'))).exists()
  };

  let started = false;
  A.onAuthStateChanged(auth, async u => {
    if (started) return; started = true;
    if (!u) return loginView();
    busy(true);
    try { const r = await afterAuth(); load(r.db); render(); }
    catch (e) { toast(fbErr(e)); loginView(); }
    finally { busy(false); }
  });
}
</script>
